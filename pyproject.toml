[project]
name = "customer-intelligence"
version = "0.1.0"
description = "A customer intelligence and personalization platform for RetailCore"
authors = [
    {name = "Mukundi Ramanyimi",email = "mukundi.ramanyimi@standardbank.co.za"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "scipy (>=1.17.1,<2.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "anthropic (>=0.86.0,<0.87.0)",
    "jupyterlab (>=4.5.6,<5.0.0)",
    "plotly (>=6.6.0,<7.0.0)",
    "google-generativeai (>=0.8.6,<0.9.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "google-genai (>=1.70.0,<2.0.0)"
]

[tool.poetry]
packages = [{include = "customer_intelligence", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
